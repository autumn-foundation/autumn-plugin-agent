name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all-targets --all-features
        env:
          TMPDIR: ${{ runner.temp }}
      - name: clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: test (no default features)
        run: cargo test --locked --all-targets --no-default-features
        env:
          TMPDIR: ${{ runner.temp }}
      - name: no autumn-web without the autumn feature
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --no-default-features -e normal --prefix none)"
          if grep -q '^autumn-web ' <<<"$tree"; then
            echo "autumn-web is in the no-default dependency graph" >&2
            exit 1
          fi
